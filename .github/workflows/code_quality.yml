name: lint and test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-test:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules, build and lint artifacts
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
            /root/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: |
          if [ -z "$(go list ./...)" ]; then
            echo "No Go packages to lint, skipping"
            exit 0
          fi
          golangci-lint run

      - name: Run go test
        run: |
          pkgs=$(go list ./... | grep -vE "internal/testing|database/generated")
          if [ -z "$pkgs" ]; then
            echo "No Go packages to test, skipping"
            exit 0
          fi
          go test $pkgs
