version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errorlint
    - goconst
    - gocyclo
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
  settings:
    depguard:
      rules:
        domain-pure:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/shopspring/decimal
        app-layers:
          files:
            - "**/internal/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nikimonax/laretz/internal/app
            - github.com/nikimonax/laretz/internal/domain
            - github.com/go-logr/logr
            - github.com/shopspring/decimal
        lib-reusable:
          files:
            - "**/internal/lib/**"
            - "!$test"
          allow:
            - $gostd
        impl-layers:
          files:
            - "**/internal/impl/**"
            - "!$test"
          deny:
            - pkg: github.com/nikimonax/laretz/internal/server
              desc: impl must not depend on server
            - pkg: github.com/nikimonax/laretz/internal/lib
              desc: impl must not depend on lib
            - pkg: github.com/nikimonax/laretz/internal/testing
              desc: impl must not depend on testing helpers
            - pkg: github.com/nikimonax/laretz/cmd
              desc: impl must not depend on cmd
    gocyclo:
      min-complexity: 15
    goconst:
      ignore-tests: true
    dupl:
      threshold: 100
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    rowserrcheck:
      packages:
        - database/sql
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - sqlclosecheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nikimonax/laretz

run:
  timeout: 3m
  issues-exit-code: 1
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
